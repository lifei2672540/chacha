name: ChachaMusic
options:
  bundleIdPrefix: com.chacha
targets:
  ChachaMusic:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - ChachaMusic
    info:
      properties:
        CFBundleDisplayName: 茶茶听音乐
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chacha.music
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
