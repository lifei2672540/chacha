name: Build Drama IPA
on:
  push:
    paths:
      - 'ChachaDrama/**'
      - '.github/workflows/drama.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Python (BeeWare 3.11, iOS)
        working-directory: ChachaDrama
        run: |
          set -e
          # 定死 3.11 最新 tag，不调 GitHub API（CI 上曾撞未登录限流导致解析失败）
          ASSET="https://github.com/beeware/python-apple-support/releases/download/3.11-b13/Python-3.11-iOS-support.b13.tar.gz"
          echo "Asset: $ASSET"
          curl -fL -o python-ios.tar.gz "$ASSET"
          mkdir -p py-support && tar xzf python-ios.tar.gz -C py-support
          echo "--- layout ---"
          find py-support -maxdepth 4 | head -60
          PYLIB=$(find py-support -type d -name "python3.11" | grep -v simulator | head -1)
          if [ -z "$PYLIB" ]; then PYLIB=$(find py-support -type d -name "python3.11" | head -1); fi
          echo "stdlib at: $PYLIB"
          test -n "$PYLIB"
          mkdir -p python/lib
          cp -R "$PYLIB" python/lib/
          # 扩展模块 .so 不在根 lib 里，在真机 slice 的 lib-arm64 下（含 _ssl），必须一起拷
          cp -R py-support/Python.xcframework/ios-arm64/lib-arm64/python3.11/lib-dynload python/lib/python3.11/
          cp -R py-support/Python.xcframework ./Python.xcframework
          # 签名墙实验：放 Resources/python 下的 .so AltStore 不签，iOS 拒绝加载
          # （真机 dlopen 报错 code signature）；改放进 Python.framework 内，让 AltStore
          # 签名框架时一并覆盖；资源目录下只留空壳，避免未签名的副本被先找到
          mkdir -p Python.xcframework/ios-arm64/Python.framework/lib-dynload
          cp py-support/Python.xcframework/ios-arm64/lib-arm64/python3.11/lib-dynload/*.so Python.xcframework/ios-arm64/Python.framework/lib-dynload/
          rm -f python/lib/python3.11/lib-dynload/*.so
          # 临时签名实验：AltStore 不签框架内的 .so，iOS 要求至少临时签名；
          # CI 里用 codesign -s - 给每个 .so 做临时签名，装机后探针见分晓
          for f in Python.xcframework/ios-arm64/Python.framework/lib-dynload/*.so; do codesign --force --sign - "$f"; done
          codesign -dv Python.xcframework/ios-arm64/Python.framework/lib-dynload/math.cpython-311-iphoneos.so 2>&1 | head -3 || true
          echo "--- bundle inputs ---"
          ls Python.xcframework/ios-arm64/Python.framework/lib-dynload | wc -l
          ls python/lib/python3.11/lib-dynload | wc -l
          du -sh python Python.xcframework
      - name: Vendor pure Python deps (stage 2)
        working-directory: ChachaDrama
        run: |
          set -e
          rm -rf py-vend && mkdir -p py-vend
          python3 -m pip download requests==2.34.2 urllib3==2.8.0 charset_normalizer==3.5.2 idna==3.20 certifi==2026.10.23 --no-deps --no-binary :all: -d py-vend/sdists -q
          mkdir -p py-vend/x
          for f in py-vend/sdists/*.tar.gz; do tar xzf "$f" -C py-vend/x; done
          cp -r py-vend/x/requests-2.34.2/src/requests app/requests
          cp -r py-vend/x/urllib3-2.8.0/src/urllib3 app/urllib3
          cp -r py-vend/x/charset_normalizer-3.5.2/src/charset_normalizer app/charset_normalizer
          cp -r py-vend/x/idna-3.20/idna app/idna
          cp -r py-vend/x/certifi-2026.10.23/certifi app/certifi
          mkdir -p app/licenses
          cp py-vend/x/requests-2.34.2/LICENSE app/licenses/requests-LICENSE
          cp py-vend/x/urllib3-2.8.0/LICENSE.txt app/licenses/urllib3-LICENSE
          cp py-vend/x/charset_normalizer-3.5.2/LICENSE app/licenses/charset_normalizer-LICENSE
          cp py-vend/x/idna-3.20/LICENSE.md app/licenses/idna-LICENSE
          cp py-vend/x/certifi-2026.10.23/LICENSE app/licenses/certifi-LICENSE
          echo "so files: $(find app -name '*.so' | wc -l)"
          du -sh app
      # 交叉 venv 必须用与目标一致的 Python 3.11 建（xvenv 源码校验：
      # 目标 venv 的版本必须与 sysconfig 的 VERSION 一致，否则报
      # "target venv is Python X; build details file is for Python 3.11"；
      # runner 自带的 python3 是 3.12/3.13，直接建 venv 一定失败）。
      - name: Setup Python 3.11 for cross build
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Crypto and lxml for iOS (best effort)
        working-directory: ChachaDrama
        continue-on-error: true
        run: |
          set +e
          # 第二步：要 Crypto/lxml 的源才能跑。没有现成配方，走 BeeWare xbuild 的交叉 venv；
          # cibuildwheel 的 iOS 构建只支持 3.13/3.14，本项目是 3.11，此路不通。
          # 本步失败不影响主构建：没编出来的库，源照旧显示原因，不闪退。
          echo "=== Crypto/lxml cross build (best effort) ==="
          # 交叉 venv：只带 --sysconfig，不带 --platform 也不带 --arch。
          # --sysconfig 不能和 --platform 同用；--arch 又必须配 --platform
          # （1.0.6 就是死在这句上）；不带 --sysconfig 时 xvenv 会自己下载
          # 最新版 Python 3.15，编出来的扩展与本项目 3.11 解释器不兼容。
          # sysconfig 文件本身已标明 arm64-iphoneos，不用再传 --arch。
          python3 --version
          SYSCONFIG=$(find py-support -name "_sysconfigdata__ios_arm64-iphoneos.py" 2>/dev/null | head -1)
          echo "sysconfig: ${SYSCONFIG:-none}"
          if [ -z "$SYSCONFIG" ]; then echo "CRYPTO_LXML: no 3.11 sysconfig found"; exit 0; fi
          # sysconfig 里的编译器是 BeeWare 的包装器名（arm64-apple-ios-clang 等），
          # 包装脚本就躺在支持包里，只是没在 PATH 上——不加 PATH 的话 pip wheel
          # 报 "No such file or directory: 'arm64-apple-ios-clang"（1.0.7 就是死在这）。
          export PATH="$PWD/py-support/Python.xcframework/ios-arm64/bin:$PATH"
          export IPHONEOS_DEPLOYMENT_TARGET=13.0
          which arm64-apple-ios-clang arm64-apple-ios-clang++ arm64-apple-ios-ar || true
          python3 -m venv venv-xbuild
          source venv-xbuild/bin/activate
          python -m pip install -q xbuild
          xvenv --sysconfig "$SYSCONFIG" x-venv || { echo "CRYPTO_LXML: xvenv --sysconfig failed"; exit 0; }
          if [ ! -d x-venv ]; then echo "CRYPTO_LXML: xvenv failed"; exit 0; fi
          source x-venv/bin/activate || true
          # 在交叉 venv 里直接用 pip wheel 编轮子：pip 会按目标平台的 sysconfig
          # 调用 iOS 交叉编译器。xbuild 本身不在交叉 venv 的 PATH 里，上次就是卡在这里。
          mkdir -p dist-cross
          python -m pip wheel --no-deps --no-binary :all: -w dist-cross "pycryptodome==3.23.0" || echo "CRYPTO_LXML: pycryptodome wheel failed"
          # lxml 走静态依赖：iOS SDK 有 libxml2、无 libxslt，只能静态链接 libxml2+libxslt
          STATIC_DEPS=true python -m pip wheel --no-deps --no-binary :all: -w dist-cross "lxml==6.0.0" || echo "CRYPTO_LXML: lxml wheel failed"
          deactivate || true
          find dist-cross -name '*.whl' | sort
          mkdir -p py-vend/cross
          for w in $(find dist-cross -name '*.whl'); do unzip -o -q "$w" -d py-vend/cross; done
          echo "cross .so files:"
          find py-vend/cross -name '*.so' | sort
          [ -d py-vend/cross/Crypto ] && cp -r py-vend/cross/Crypto app/Crypto
          [ -d py-vend/cross/lxml ] && cp -r py-vend/cross/lxml app/lxml
          # pycryptodome 的 .so 是 ctypes/cffi 按文件路径加载的，import 钩子覆盖不到；
          # 打补丁让它先解析 .fwork 指针再 dlopen（补丁已在沙箱用真 3.23.0 源码验过）。
          [ -f app/Crypto/Util/_raw_api.py ] && python3 scripts/patch_raw_api.py app/Crypto/Util/_raw_api.py
          echo "CRYPTO_LXML: Crypto .so in app: $(find app/Crypto -name '*.so' 2>/dev/null | wc -l)"
          echo "CRYPTO_LXML: lxml .so in app: $(find app/lxml -name '*.so' 2>/dev/null | wc -l)"
          file app/Crypto/Cipher/_raw_aes.abi3.so 2>/dev/null || true
          exit 0
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ChachaDrama
        run: xcodegen generate
      - name: Probe generated project wiring
        working-directory: ChachaDrama
        run: |
          echo "--- Python.xcframework refs in pbxproj ---"
          grep -n "Python.xcframework" ChachaDrama.xcodeproj/project.pbxproj || echo "NO FRAMEWORK REF"
          echo "--- FRAMEWORK_SEARCH_PATHS ---"
          grep -n "FRAMEWORK_SEARCH_PATHS" -A 3 ChachaDrama.xcodeproj/project.pbxproj || echo "NO SEARCH PATHS"
          echo "--- Embed Frameworks phase ---"
          grep -n "Embed Frameworks" ChachaDrama.xcodeproj/project.pbxproj || echo "NO EMBED PHASE"
      - name: Archive (unsigned, for AltStore self-signing)
        working-directory: ChachaDrama
        run: |
          xcodebuild -project ChachaDrama.xcodeproj -scheme ChachaDrama -sdk iphoneos -configuration Release archive -archivePath build/ChachaDrama.xcarchive CODE_SIGNING_ALLOWED=NO
      - name: Convert extension modules to frameworks (ant-video style)
        working-directory: ChachaDrama
        run: |
          set -e
          # 蚂蚁式打包：裸 .so 签名工具不认，iOS 拒绝加载；每个扩展模块转成
          # 独立 .framework（标准签名对象），lib-dynload 里只留 .fwork 指针
          # （内容为相对 .app 的框架二进制路径），运行时由 app/fwfinder.py 按指针加载。
          # App 此时未签名，打包后改 .app 不破坏任何签名。
          APP=build/ChachaDrama.xcarchive/Products/Applications/ChachaDrama.app
          DYNLIB="$APP/Frameworks/Python.framework/lib-dynload"
          FWDIR="$APP/Frameworks"
          count=0
          for so in "$DYNLIB"/*.so; do
            [ -e "$so" ] || continue
            base=$(basename "$so")
            name="${base%%.cpython-*}"
            mkdir -p "$FWDIR/$name.framework"
            cp "$so" "$FWDIR/$name.framework/$name"
            install_name_tool -id "@rpath/$name.framework/$name" "$FWDIR/$name.framework/$name" || true
            cat > "$FWDIR/$name.framework/Info.plist" <<PLISTEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>$name</string>
            <key>CFBundleIdentifier</key><string>org.python.$name</string>
            <key>CFBundleName</key><string>$name</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>3.11</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>16.0</string>
          </dict>
          </plist>
          PLISTEOF
            printf 'Frameworks/%s.framework/%s' "$name" "$name" > "$DYNLIB/$name.fwork"
            codesign --force --sign - "$FWDIR/$name.framework/$name" || true
            rm "$so"
            count=$((count + 1))
          done
          # Crypto/lxml 包内扩展：有就按同一套打法转框架（点分名防子包同名），
          # 没编出来就跳过——best effort，失败不影响主流程。
          python3 scripts/convert_pkg_modules.py "$APP" || echo "pkg convert skipped/failed"
          echo "converted $count modules to frameworks"
          echo "remaining .so in app: $(find "$APP" -name '*.so' | wc -l)"
          echo "frameworks in app: $(ls -d "$FWDIR"/*.framework | wc -l)"
          echo "fwork pointers: $(find "$APP" -name '*.fwork' | wc -l)"
          test "$count" -gt 0
      - name: Package IPA
        working-directory: ChachaDrama
        run: |
          mkdir -p Payload
          cp -r build/ChachaDrama.xcarchive/Products/Applications/ChachaDrama.app Payload/
          zip -r ChachaDrama-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChachaDrama-unsigned-ipa
          path: ChachaDrama/ChachaDrama-unsigned.ipa
