name: GHT63iOS
options:
  bundleIdPrefix: com.ght63
targets:
  GHT63iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GHT63iOS
      # 内嵌 Python 标准库（CI 里从 BeeWare 包拷出，真机 slice，见 workflow）
      - path: python
        type: folder
      # 蜘蛛桥 + 纯 Python 依赖（桥代码进仓库，第三方包由 CI 拉源码包解进 app/）
      - path: app
        type: folder
    # 注意：XcodeGen 没有 target 级 frameworks 键，预编译框架必须走 dependencies 的 framework 项，
    # 之前 frameworks 写法被静默忽略，工程里根本没链 Python 框架（第 17 次构建的探查已证实）。
    dependencies:
      - framework: Python.xcframework
        embed: true
      # 磁力引擎（CI 里从 libtorrent-ios-xcframework.zip 解出，见 ios.yml）
      - framework: libtorrent_flutter.xcframework
        embed: true
      # libtorrent 依赖的系统框架（监听 IP 变化用）
      # 注意：系统框架不能嵌进包里（XcodeGen 默认会嵌，导致打包时找不到文件来拷），必须 embed: false
      - framework: SystemConfiguration
        embed: false
    info:
      path: GHT63iOS/Info.plist
      properties:
        CFBundleDisplayName: 茶茶点播
        CFBundleShortVersionString: 1.5.11
        CFBundleVersion: "52"
        # 启动屏：没有它 iOS 会把 App 当老应用 letterbox（16 Pro Max 上只占半屏）
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ght63.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: GHT63iOS/GHT63iOS-Bridging-Header.h
        # libtorrent 是 C++ 静态库，链接时要带 C++ 标准库（否则 std::logic_error 等符号找不到）
        # 并显式链 SystemConfiguration（XcodeGen 只把它放进 Embed，没放进链接阶段，_SCNetworkReachability* 会找不到）
        OTHER_LDFLAGS: -lc++ -framework SystemConfiguration
